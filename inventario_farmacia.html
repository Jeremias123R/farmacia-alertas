<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario de farmacia</title>
<style>
  :root {
    --teal: #0F6E56;
    --teal-light: #E1F5EE;
    --amber: #BA7517;
    --amber-light: #FAEEDA;
    --red: #A32D2D;
    --red-light: #FCEBEB;
    --gray-text: #5F5E5A;
    --border: #D3D1C7;
    --bg: #F7F6F2;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    margin: 0;
    padding: 16px;
    color: #222;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .subtitle { font-size: 13px; color: var(--gray-text); margin: 0 0 20px; }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .stat-card { background: white; border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .stat-label { font-size: 12px; color: var(--gray-text); margin: 0 0 4px; }
  .stat-value { font-size: 26px; font-weight: 600; margin: 0; }
  .stat-value.warn { color: var(--amber); }

  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .toolbar h2 { font-size: 15px; font-weight: 600; margin: 0; }
  button {
    font-family: inherit; font-size: 13px; cursor: pointer;
    border: 1px solid var(--border); background: white; border-radius: 8px;
    padding: 8px 14px;
  }
  button:hover { background: #f0efea; }
  button.primary { background: var(--teal); color: white; border-color: var(--teal); }
  button.primary:hover { opacity: 0.92; }

  #list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
  .med-card { background: white; border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; }
  .med-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .med-name { font-size: 14px; font-weight: 600; margin: 0; }
  .med-exp { font-size: 12px; color: var(--gray-text); margin: 2px 0 0; }
  .badge { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; white-space: nowrap; }
  .badge.ok { background: var(--teal-light); color: var(--teal); }
  .badge.soon, .badge.low { background: var(--amber-light); color: var(--amber); }
  .badge.expired { background: var(--red-light); color: var(--red); }
  .med-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .med-stock { font-size: 12px; color: var(--gray-text); }
  .med-stock b { color: #222; }
  .qty-controls { display: flex; gap: 4px; }
  .qty-controls button { width: 30px; height: 30px; padding: 0; font-size: 15px; }
  .del-btn { border-color: var(--red-light); color: var(--red); }

  #form-wrap {
    display: none; background: white; border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; margin-bottom: 20px;
  }
  #form-wrap p.title { font-size: 14px; font-weight: 600; margin: 0 0 12px; }
  #form-wrap input {
    width: 100%; font-size: 14px; padding: 9px 10px; border: 1px solid var(--border);
    border-radius: 8px; margin-bottom: 8px; font-family: inherit;
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #f-error { display: none; font-size: 12px; color: var(--red); margin: 0 0 8px; }
  .form-actions { display: flex; gap: 8px; margin-top: 4px; }
  .form-actions button { flex: 1; }

  #status-msg { font-size: 13px; color: var(--gray-text); text-align: center; padding: 20px 0; }
  #status-msg.error { color: var(--red); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Inventario de farmacia</h1>
  <p class="subtitle">Alertas de vencimiento y reposición de stock</p>

  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <h2>Medicamentos</h2>
    <button class="primary" id="btn-add">+ Agregar</button>
  </div>

  <div id="form-wrap">
    <p class="title">Nuevo medicamento</p>
    <input id="f-name" type="text" placeholder="Nombre (ej. Amoxicilina 500mg)">
    <div class="row2">
      <input id="f-qty" type="number" min="0" placeholder="Cantidad">
      <input id="f-min" type="number" min="0" placeholder="Stock mínimo">
    </div>
    <input id="f-exp" type="date">
    <input id="f-lote" type="text" placeholder="Lote (opcional)">
    <p id="f-error">Completa nombre, cantidad y fecha de vencimiento.</p>
    <div class="form-actions">
      <button class="primary" id="f-save">Guardar</button>
      <button id="f-cancel">Cancelar</button>
    </div>
  </div>

  <div id="status-msg">Cargando inventario...</div>
  <div id="list"></div>
</div>

<script>
// --- Configuración de conexión a Supabase ---
const SUPABASE_URL = "https://evrgtdoltmudexfbuwil.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV2cmd0ZG9sdG11ZGV4ZmJ1d2lsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwNDg4ODEsImV4cCI6MjEwMzYyNDg4MX0.l7rmVqrl6BN-c1NQqFmXWnlQa0vdPmaF42X_xjld92Y";
const TABLE_URL = SUPABASE_URL + "/rest/v1/Medicamentos";
const HEADERS = {
  "apikey": SUPABASE_ANON_KEY,
  "Authorization": "Bearer " + SUPABASE_ANON_KEY,
  "Content-Type": "application/json",
  "Prefer": "return=representation"
};

const DAY = 86400000;
const today = new Date(); today.setHours(0,0,0,0);
let meds = [];

function fmtDate(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString('es-BO', { day: '2-digit', month: 'short', year: 'numeric' });
}
function daysTo(iso) {
  const d = new Date(iso + "T00:00:00");
  return Math.round((d - today) / DAY);
}
function status(m) {
  const d = daysTo(m.Fecha_vencimiento);
  const lowStock = m.Cantidad <= m.Stock_minimo;
  if (d < 0) return { label: 'Vencido', cls: 'expired' };
  if (d <= 30) return { label: 'Vence en ' + d + ' días', cls: 'soon' };
  if (lowStock) return { label: 'Stock bajo', cls: 'low' };
  return { label: 'En orden', cls: 'ok' };
}

async function loadMeds() {
  const statusEl = document.getElementById('status-msg');
  statusEl.style.display = 'block';
  statusEl.textContent = 'Cargando inventario...';
  statusEl.className = '';
  try {
    const res = await fetch(TABLE_URL + "?select=*&order=Fecha_vencimiento.asc", { headers: HEADERS });
    if (!res.ok) {
      const body = await res.text();
      throw new Error("(" + res.status + ") " + body);
    }
    meds = await res.json();
    statusEl.style.display = 'none';
    render();
  } catch (err) {
    statusEl.textContent = "Error al cargar datos: " + err.message;
    statusEl.className = 'error';
  }
}

function render() {
  const soon = meds.filter(m => daysTo(m.Fecha_vencimiento) <= 30).length;
  const low = meds.filter(m => m.Cantidad <= m.Stock_minimo).length;

  document.getElementById('stats').innerHTML =
    '<div class="stat-card"><p class="stat-label">Por vencer (30 días)</p>' +
    '<p class="stat-value ' + (soon ? 'warn' : '') + '">' + soon + '</p></div>' +
    '<div class="stat-card"><p class="stat-label">Para reponer</p>' +
    '<p class="stat-value ' + (low ? 'warn' : '') + '">' + low + '</p></div>';

  if (meds.length === 0) {
    document.getElementById('list').innerHTML = '<p style="font-size:13px;color:var(--gray-text);text-align:center;padding:20px 0;">No hay medicamentos registrados todavía.</p>';
    return;
  }

  document.getElementById('list').innerHTML = meds.map(m => {
    const s = status(m);
    return '<div class="med-card">' +
      '<div class="med-top">' +
        '<div><p class="med-name">' + escapeHtml(m.Nombre || '') + '</p>' +
        '<p class="med-exp">Vence ' + fmtDate(m.Fecha_vencimiento) + (m.Lote ? ' &middot; Lote ' + escapeHtml(m.Lote) : '') + '</p></div>' +
        '<span class="badge ' + s.cls + '">' + s.label + '</span>' +
      '</div>' +
      '<div class="med-bottom">' +
        '<p class="med-stock">Stock: <b>' + m.Cantidad + '</b> (mín. ' + m.Stock_minimo + ')</p>' +
        '<div class="qty-controls">' +
          '<button onclick="changeQty(' + m.id + ', -1)" aria-label="Restar">-</button>' +
          '<button onclick="changeQty(' + m.id + ', 1)" aria-label="Sumar">+</button>' +
          '<button class="del-btn" onclick="deleteMed(' + m.id + ')" aria-label="Eliminar">✕</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function changeQty(id, delta) {
  const m = meds.find(x => x.id === id);
  if (!m) return;
  const newQty = Math.max(0, m.Cantidad + delta);
  m.Cantidad = newQty;
  render();
  try {
    await fetch(TABLE_URL + "?id=eq." + id, {
      method: "PATCH",
      headers: HEADERS,
      body: JSON.stringify({ Cantidad: newQty })
    });
  } catch (err) {
    alert("No se pudo guardar el cambio. Revisa tu conexión.");
  }
}

async function deleteMed(id) {
  if (!confirm("¿Eliminar este medicamento del inventario?")) return;
  try {
    await fetch(TABLE_URL + "?id=eq." + id, { method: "DELETE", headers: HEADERS });
    meds = meds.filter(m => m.id !== id);
    render();
  } catch (err) {
    alert("No se pudo eliminar. Revisa tu conexión.");
  }
}

document.getElementById('btn-add').onclick = () => {
  document.getElementById('form-wrap').style.display = 'block';
};
document.getElementById('f-cancel').onclick = () => {
  document.getElementById('form-wrap').style.display = 'none';
  document.getElementById('f-error').style.display = 'none';
};
document.getElementById('f-save').onclick = async () => {
  const nombre = document.getElementById('f-name').value.trim();
  const cantidad = document.getElementById('f-qty').value;
  const stock_minimo = document.getElementById('f-min').value;
  const fecha_vencimiento = document.getElementById('f-exp').value;
  const lote = document.getElementById('f-lote').value.trim();

  if (!nombre || cantidad === '' || !fecha_vencimiento) {
    document.getElementById('f-error').style.display = 'block';
    return;
  }
  document.getElementById('f-error').style.display = 'none';

  const payload = {
    Nombre: nombre,
    Cantidad: Number(cantidad),
    Stock_minimo: stock_minimo === '' ? 0 : Number(stock_minimo),
    Fecha_vencimiento: fecha_vencimiento,
    Lote: lote || null
  };

  try {
    const res = await fetch(TABLE_URL, {
      method: "POST",
      headers: HEADERS,
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error("Error " + res.status);
    const [nuevo] = await res.json();
    meds.push(nuevo);
    meds.sort((a, b) => a.Fecha_vencimiento.localeCompare(b.Fecha_vencimiento));
    document.getElementById('f-name').value = '';
    document.getElementById('f-qty').value = '';
    document.getElementById('f-min').value = '';
    document.getElementById('f-exp').value = '';
    document.getElementById('f-lote').value = '';
    document.getElementById('form-wrap').style.display = 'none';
    render();
  } catch (err) {
    alert("No se pudo guardar el medicamento. Revisa tu conexión.");
  }
};

loadMeds();
</script>
</body>
</html>
